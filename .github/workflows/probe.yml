name: Test old newspaper days

# One-off test: can the game server give the newspaper of earlier days?
# Runs by itself when scripts/probe_news.js changes, or via the "Run workflow" button.
on:
  push:
    paths: ['scripts/probe_news.js', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ask for older newspaper days
        env:
          COW_USERNAME: ${{ secrets.COW_USERNAME }}
          COW_PASSWORD: ${{ secrets.COW_PASSWORD }}
        run: node scripts/probe_news.js
      - name: Save result
        run: |
          git config user.name "ava-maps bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "Newspaper test result" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
