<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0a0c10; --panel:#0d1117; --panel2:#111827; --line:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --brass:#b48c3c; --green:#22c55e; --red:#ef4444; --yellow:#facc15; --orange:#f97316; --grey:#94a3b8;
  --display:"Rajdhani","Arial Narrow",sans-serif; --body:"Rajdhani",system-ui,sans-serif; --mono:"Share Tech Mono",ui-monospace,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;font-weight:500;margin:0}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(180,140,60,.5);flex:none}
.brand .bt{font-size:18px;font-weight:700;letter-spacing:3px;line-height:1;text-transform:none}
.brand .bs{white-space:nowrap;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:2px;color:var(--brass);text-transform:uppercase;margin-top:3px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 320px;grid-template-areas:"top top" "map feed" "bar bar"}
header{grid-area:top;display:flex;align-items:center;gap:20px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand .back{color:var(--muted);text-decoration:none;margin-right:10px}.brand .back:hover{color:var(--text)}
.brand .gname{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--muted);margin-top:3px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.cas{padding:0 14px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cas-tot{display:flex;gap:16px;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cas-tot b{font-family:var(--mono);font-size:18px;letter-spacing:0;margin-left:4px}
.cas-tot .g b{color:var(--green)} .cas-tot .r b{color:var(--red)}
.cas-n summary{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;cursor:pointer;list-style:none;padding:3px 0;font-size:13px}
.cas-n summary::-webkit-details-marker{display:none}
.cas-n summary i{width:8px;height:8px;border-radius:2px;background:var(--grey)}
.cas-n.k-G summary i{background:var(--green)} .cas-n.k-R summary i{background:var(--red)}
.cas-n summary b,.cas-n li b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.cas-n ul{list-style:none;margin:0 0 4px 16px;padding:0;font-size:12px;color:var(--muted)}
.cas-n li{display:flex;justify-content:space-between;gap:8px;line-height:1.5}
.cas-note{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
.upd{margin-left:auto;text-align:right;font-family:var(--body);font-size:11px;letter-spacing:.06em;color:var(--muted);line-height:1.5}
.upd b{display:block;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.upd b.soon{color:var(--brass)}
.upd+.clock,.every+.clock{margin-left:0}
.every{display:flex;flex-direction:column;gap:2px;font-family:var(--body);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.every select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px;padding:0 4px;cursor:pointer}
.every select:focus-visible{outline:1px solid var(--brass)}
.every em{font-style:normal;color:var(--brass);font-size:10px}
@media (max-width:820px){.upd{margin-left:0;text-align:left}}
.clock{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums;margin-left:auto}
.clock span{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--body);text-align:right}
.tally{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1 1 auto;min-width:0;font-family:var(--display);font-size:15px;letter-spacing:.04em}
@media (min-width:821px){header{flex-wrap:nowrap}}
.tally b{font-family:var(--mono);font-size:16px}
.chip{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.map{grid-area:map;position:relative;overflow:hidden;background:#2b4c5b;cursor:grab;touch-action:none}
.map.drag{cursor:grabbing}
.pan{position:absolute;inset:0}
.map.drag .pan{will-change:transform}   /* own layer only while dragging; a permanent one keeps the label text rendered soft */
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.world img.new{animation:flash 1.4s ease-out}
.world canvas{position:absolute;left:0;top:0;pointer-events:none}
@keyframes flash{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.marks{position:absolute;inset:0;pointer-events:none}
.war{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);font-family:var(--display);font-size:14px;letter-spacing:.04em;cursor:pointer}
.war:hover{border-color:var(--red)}
.war[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.hrs{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-family:var(--display);font-size:14px;color:var(--muted)}
.hrs input{width:48px;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--ink);color:var(--text);font-family:var(--mono);font-size:13px;padding:0 4px;text-align:right}
.hrs input:focus-visible{outline:1px solid var(--brass)}
.lines .path{fill:none;stroke-width:4.5;stroke-linecap:round;opacity:1}.lines .pcase{fill:none;stroke:#0b1218;stroke-width:9;stroke-linecap:round;opacity:.9}.lines .pglow{fill:none;stroke-width:14;stroke-linecap:round;opacity:.28}
.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;stroke:rgba(231,237,233,.75);stroke-width:1}
.hint{position:absolute;left:12px;top:12px;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--brass)}
.mk{position:absolute;left:0;top:0;width:13px;height:13px;pointer-events:none;cursor:pointer}
.mk .dot,.mk .tag{pointer-events:auto}
.mk:hover,.mk.sel{z-index:5}
.tag{width:max-content}
.tag .ln>*{flex:none}
.mk .tag{position:absolute;left:0;top:0;transform:translate(14px,-4px)}
.dot{display:block;box-sizing:border-box;width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:#111;flex:none}
.mk.k-G .dot{background:var(--green)} .mk.k-R .dot{background:var(--red)} .mk.k-X .dot{background:var(--yellow)} .mk.k-O .dot{background:var(--orange)} .mk.k-N .dot{background:var(--grey)}
.mk.atk .dot{background:#0d171e;border-color:#fff}
.mk.hot::before{content:'';position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;border:2px solid rgba(180,140,60,.9);box-sizing:border-box;animation:pulse 1.2s ease-out infinite;pointer-events:none}
@keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(2.6);opacity:0}}
.tag{font-family:var(--display);font-size:calc(10.5px*var(--ls,1));font-weight:600;letter-spacing:.03em;background:rgba(13,17,23,.9);border:1px solid var(--line);padding:0 calc(4px*var(--ls,1));border-radius:3px;white-space:nowrap}
.tag em{font-style:normal;font-family:var(--mono);font-size:calc(7.5px*var(--ls,1));color:var(--brass);margin-right:calc(4px*var(--ls,1))}
.mk.sel .tag{border-color:var(--brass)}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
aside{grid-area:feed;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside h2{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--brass);margin:0;padding:12px 14px 8px}
.detail{padding:0 14px 12px;border-bottom:1px solid var(--line)}
.detail h3{font-family:var(--display);font-size:22px;margin:0 0 6px;letter-spacing:.03em}
.detail .none{color:var(--muted);font-size:13px}
.feed{overflow-y:auto;flex:1;padding:4px 8px 12px;contain:strict}
.feed .ev{content-visibility:auto;contain-intrinsic-size:auto 78px}
aside{contain:layout paint}
.ev{display:grid;grid-template-columns:44px 10px 1fr;gap:8px;align-items:start;padding:6px 6px;border-radius:5px;cursor:pointer}
.ev:hover,.ev:focus-visible{background:var(--panel2);outline:none}
.ev time small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
.ev time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .bar{width:4px;height:100%;min-height:26px;border-radius:2px;background:var(--grey)}
.ev.k-G .bar{background:var(--green)} .ev.k-R .bar{background:var(--red)} .ev.k-X .bar{background:var(--yellow)} .ev.k-O .bar{background:var(--orange)} .ev.k-N .bar{background:var(--grey)}
.ev b{font-family:var(--display);font-size:15px;letter-spacing:.03em;font-weight:600}
.ev p{margin:1px 0 0;font-size:12.5px;color:var(--muted);line-height:1.35}
.ev.cap p{color:var(--text)}
.ev .badge{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 5px;border-radius:3px;margin-left:6px;background:var(--line);color:var(--text)}
.ev.cap .badge{background:var(--brass);color:#0a0c10}
footer{grid-area:bar;border-top:1px solid var(--line);background:var(--panel);padding:10px 16px 12px;display:grid;grid-template-columns:1fr auto;grid-template-areas:'ctl legend' 'track track';gap:8px 14px;align-items:center}
footer .ctl{grid-area:ctl}footer .track{grid-area:track}footer .legend{grid-area:legend}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--display);font-size:15px;letter-spacing:.04em;padding:0 12px;cursor:pointer}
.ctl button.play{background:#16a34a;color:#fff;border-color:#16a34a;min-width:86px;font-weight:700}
.track{position:relative;height:44px}
.ticks{position:absolute;left:0;right:0;top:4px;height:16px}
.ticks i{position:absolute;top:0;width:2px;height:16px;border-radius:1px;opacity:.9}
.ticks i.a{height:7px;top:9px;background:#5d7482}
.hours{position:absolute;left:0;right:0;top:24px;height:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.hours span{position:absolute;transform:translateX(-50%)}
input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:24px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:24px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:24px;background:var(--brass);border-radius:2px;box-shadow:0 0 0 3px rgba(180,140,60,.25)}
input[type=range]::-moz-range-thumb{width:4px;height:24px;background:var(--brass);border:0;border-radius:2px}
input[type=range]:focus-visible{outline:1px solid var(--brass)}
.ctl{flex-wrap:wrap}
.tag .ln{display:flex;align-items:center;gap:calc(3px*var(--ls,1));font-family:var(--body);font-weight:500;font-size:calc(8px*var(--ls,1));letter-spacing:0;line-height:1.2}
.tag .ln.sub{padding-left:calc(15px*var(--ls,1));font-size:calc(7px*var(--ls,1));color:var(--muted);opacity:.9}
.tag .ln.sub b{color:inherit;font-weight:600}
.tag .ln i{width:calc(5px*var(--ls,1));height:calc(5px*var(--ls,1));border-radius:1px;flex:none;background:var(--grey)}
.tag .ln i.k-G{background:var(--green)}.tag .ln i.k-R{background:var(--red)}.tag .ln i.k-X{background:var(--yellow)}.tag .ln i.k-O{background:var(--orange)}.tag .ln i.k-N{background:var(--grey)}
.tag .ln em{margin-right:0}
.tag.full{padding:calc(1px*var(--ls,1)) calc(3px*var(--ls,1))}
.tag.cmp .ln{display:none}
.tag.full .nm{display:block;color:var(--brass);font-size:calc(8.5px*var(--ls,1));line-height:1.15}
.tag .ln i.note{font-style:italic;color:var(--muted);width:auto;height:auto;background:none}
.tag .nm .earlier{font-family:var(--body);font-weight:500;font-size:.8em;color:var(--muted);margin-left:4px}
.tag .ln b.uid{font-family:var(--mono);font-weight:600;color:var(--brass)}
.tag .ln b.lost{font-weight:600;color:#ff9b9b}
.ev .badge.lost{background:#5a1f25;color:#ffc9c9}
.lostt{color:var(--muted)}
.mk.haslost::after{content:'✕';position:absolute;left:8px;top:-9px;font:700 10px/1 var(--body);color:#fff;background:#8f1d27;border-radius:50%;width:12px;height:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 55vh auto auto;grid-template-areas:"top" "map" "bar" "feed"}
  html,body{height:auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:60vh}
  footer{grid-template-columns:1fr;grid-template-areas:'ctl' 'track' 'legend'}
  .clock{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.mk.hot::before,.world img.new{animation:none}}

.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl #speed{width:74px}
.ctl #who{width:200px;max-width:100%}
.toggles{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:34px}
.opt{position:relative;display:flex;align-items:center;cursor:pointer;font-family:var(--display);font-size:15px;letter-spacing:.04em;white-space:nowrap}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;background:var(--panel2);color:var(--muted)}
.opt span::before{content:'';width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.opt+.opt span{border-left:1px solid var(--line)}
.opt input:checked+span{background:rgba(180,140,60,.16);color:var(--text)}
.opt input:checked+span::before{background:var(--brass);border-color:var(--brass)}
.opt input:focus-visible+span{outline:1px solid var(--brass);outline-offset:-2px}
@media (max-width:820px){
  .ctl{display:grid;grid-template-columns:1fr 72px;gap:8px}
  .ctl #speed{width:100%}
  .ctl #who{grid-column:1/-1;width:100%}
  .toggles{grid-column:1/-1}
  .toggles .opt{flex:1}.toggles .opt span{width:100%;justify-content:center}
}

.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px;border-bottom:1px solid var(--line)}
.team{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel2)}
.team.lead{}
.team h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.team .pts{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.team .pts small{font-size:11px;color:var(--muted);margin-left:4px;font-family:var(--body)}
.team ul{list-style:none;margin:0;padding:0;font-size:11.5px;color:var(--muted)}
.team li{display:flex;justify-content:space-between;gap:6px;line-height:1.5}
.ui{display:inline-block;flex:none;object-fit:contain}
.tag .ln .ui{width:calc(15px*var(--ls,1));height:calc(15px*var(--ls,1));margin:calc(-2px*var(--ls,1)) 0}
.tag .ln .tx{white-space:nowrap}
.more{display:block;width:100%;margin:8px 0;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);font-family:var(--display);font-size:14px;cursor:pointer}
.wi{display:flex;align-items:flex-start;gap:8px;margin:0}
.wi .ui{width:30px;height:30px;margin-top:1px}
.wi>span:last-child{flex:1;min-width:0}
.team li b{font-family:var(--mono);font-weight:500;color:var(--text)}
.team li.prov{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--text)}.team li.prov b{font-size:14px;font-weight:600}.team li.sub{font-size:10.5px}
.score .rule{grid-column:1/-1;font-size:11px;color:var(--muted);margin:0}
/*__ICONCSS__*/

/* control bar: two aligned rows (playback on top, filters below) */
footer{grid-template-columns:auto minmax(0,1fr)!important}
footer{grid-template-areas:'ctl ctl' 'legend legend' 'track track'!important}
footer .legend{justify-self:start;flex-wrap:wrap;justify-content:flex-start;gap:6px 18px;padding:2px 0}
footer .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
footer .legend .chip{margin:0;width:10px;height:10px}
.lostic{width:12px;height:12px;border-radius:50%;background:#8f1d27;color:#fff;font:700 9px/1 var(--body);font-style:normal;display:inline-flex;align-items:center;justify-content:center}
.ctl .war{white-space:nowrap}
.ctl .toggles .opt span{padding:0 8px}
.ctl{display:grid!important;grid-template-columns:110px 74px 200px 200px 230px 480px;grid-auto-rows:34px;gap:8px;align-items:stretch}
.ctl>*{width:100%;min-width:0;height:34px;box-sizing:border-box}
.ctl #speed,.ctl #who{width:100%}
.ctl .hrs{justify-content:space-between}
.ctl .hrs input{flex:none}
.ctl #who{grid-column:1/4}
.ctl .toggles{grid-column:4/7}
.ctl .toggles .opt{flex:1}.ctl .toggles .opt span{width:100%;justify-content:center;box-sizing:border-box}
@media (max-width:820px){
  footer{grid-template-columns:1fr!important;grid-template-areas:'ctl' 'legend' 'track'!important}
  .ctl{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ctl .play{grid-column:1/3}.ctl #speed{grid-column:3/5}.ctl #from{grid-column:1/-1}
  .ctl .hrs{grid-column:span 2}.ctl .war{grid-column:1/-1}.ctl .presets{grid-column:1/-1}.ctl #who{grid-column:1/-1}.ctl .toggles{grid-column:1/-1}
  .ctl .toggles{display:grid;grid-template-columns:1fr 1fr;grid-row:span 3;height:auto}
  .ctl .toggles .opt span{padding:0 6px;font-size:14px;border-left:0}
  .ctl .toggles .opt:nth-child(even) span{border-left:1px solid var(--line)}
  .ctl .toggles .opt:nth-child(n+3) span{border-top:1px solid var(--line)}
}

/* the map picture has a dark frame from the game screenshot: cut it off so the map blends into the sea */
#base{clip-path:inset(3px 12px 10px 9px)}
.ctl .presets{display:grid;grid-template-columns:.8fr .9fr 1.3fr;gap:8px}
@media (max-width:820px){.ctl .presets{grid-template-columns:1fr 1fr;grid-row:span 2;height:auto}.ctl .presets #war{grid-column:1/-1}}.ctl .presets .war{width:100%;height:34px;padding:0 8px;grid-column:auto}
#plset[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0a0c10}
#aiset[aria-pressed="true"]{background:var(--grey);border-color:var(--grey);color:#0a0c10}
/* phone: the event list grows with the page instead of being a (collapsed) box of its own, so it simply scrolls with the page */
@media (max-width:820px){aside{max-height:none;contain:none}.feed{contain:none;overflow:visible;flex:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><a class="back" href="../../index.html#games" aria-label="All games">&#8592;</a><img class="logo" src="__LOGO__" alt="AF logo"><div><div class="bt">Live AVA viewer</div><div class="bs">Amicitia Ferox · __TITLE__</div></div></div>

let rafId=0,panX=0,panY=0,dragT=0;

function panBy(dx,dy){const ox=tx,oy=ty;tx+=dx;ty+=dy;clampView();panX+=tx-ox;panY+=ty-oy;
  $('pan').style.transform=`translate(${Math.round(panX)}px,${Math.round(panY)}px)`}

function focusEurope(){const r=map.getBoundingClientRect();const bx=[1250,2650],by=[380,1850];k=Math.max(minK(),Math.min(r.width/(bx[1]-bx[0]),r.height/(by[1]-by[0])));tx=r.width/2-(bx[0]+bx[1])/2*k;ty=r.height/2-(by[0]+by[1])/2*k;apply()}

const EV=D.every||60,RAN=D.ran||D.built;
const locMin=t=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t));return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value};
const markAfter=t=>{const m=Math.floor(t/60000)*60000;return m-(locMin(m)%EV)*60000+EV*60000};   // first whole moment after t
const nextSlot=t=>{const q=15*60000;return Math.ceil(t/q)*q};   // the robot looks every quarter of an hour
const nextRun=()=>markAfter(RAN);
if(D.gid&&!D.ended){const w=$('everyw'),sel=$('every');w.hidden=false;sel.value=String(EV);if(!sel.value){sel.value='60'}
  sel.addEventListener('change',()=>{const v=sel.value;if(!D.repo){$('everyn').textContent='not on GitHub yet';$('everyn').hidden=false;sel.value=String(EV);return}
    window.open('https://github.com/'+D.repo+'/issues/new?title='+encodeURIComponent('Set update '+D.gid+' every '+v)+'&body='+encodeURIComponent('Update this map every '+sel.options[sel.selectedIndex].text+'.'),'_blank','noopener');
    $('everyn').textContent='confirm on GitHub';$('everyn').hidden=v===String(EV)})}
function tick(){if(D.ended){el.innerHTML='Final map'+(D.fetched?' · game data '+new Date(D.fetched).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Europe/Amsterdam'})+' '+hm(D.fetched):'')+'<b>'+D.ended+'</b>';return}const now=Date.now(),next=nextRun(),late=now>next+20*60000,due=late?nextSlot(now):next;
  const s=Math.max(0,Math.floor((due-now)/1000)),m=Math.floor(s/60),r=String(s%60).padStart(2,'0');
  const stale=late;
  el.innerHTML='Updated '+hm(D.built)+(D.fetched?' · game data '+hm(D.fetched):'')+
    '<b class="'+(s<120?'soon':'')+'">'+(stale?'Update overdue · next try in ':'Next update in ')+m+':'+r+'</b>';}
tick();setInterval(tick,1000);})();
</script>
