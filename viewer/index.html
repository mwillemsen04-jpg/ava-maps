<!doctype html>
<html lang="en" style="background:#0a0c10">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVA Games Database</title>
<style>
html,body{height:100%;margin:0;background:#0a0c10}
#view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0c10}
#boot{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0c10;color:#e2e8f0;font-family:system-ui,sans-serif}
#boot .t{letter-spacing:4px;text-transform:uppercase;color:#64748b;font-size:12px}
#err{color:#ef4444;font-size:13px;margin-top:10px;text-align:center;padding:0 16px;max-width:320px}
</style>
</head>
<body>
<iframe id="view" title="AVA Games" hidden></iframe>
<div id="boot"><div class="t">Loading</div><div id="err"></div></div>
<script>
/* AVA viewer, planner-style: the maps live in the database and are served by the
   backend behind the clan password. This page logs in and shows the pages from
   the backend inside the frame. Nothing about the games is public any more. */
(function(){
  var BASE=(window.AF_BACKEND||'https://af-farm-backend.onrender.com').replace(/\/+$/,'');
  var KEY='afp_backend_pw';                 /* same login as the planner */
  var view=document.getElementById('view'), boot=document.getElementById('boot'), errEl=document.getElementById('err');
  function pw(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
  function setPw(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function api(sub,tries){ tries=tries||0;
    return fetch(BASE+sub,{headers:{'Authorization':'Bearer '+pw()}})
      .then(function(r){ if(r.status===401){ askLogin(true); throw new Error('unauthorized'); }
        if(r.status===404){ throw new Error('notuploaded'); }
        if(!r.ok) throw new Error('http '+r.status); return r.text(); })
      .catch(function(e){ var m=e&&e.message;
        if((m==='unauthorized'||m==='notuploaded')||tries>=3) throw e;      /* real answer, or give up: stop retrying */
        return sleep(1500).then(function(){ return api(sub,tries+1); });    /* network/cold-start: try again */
      }); }

  function gameIdFromHref(href){ if(!href) return null;
    var m=String(href).match(/games\/([0-9A-Za-z_-]{1,40})\/(?:index\.html)?/); return m?m[1]:null; }
  function isBack(href){ return /(^|\/)index\.html(#|$)/.test(String(href||'')) || /#games$/.test(String(href||'')); }

  function show(html){ boot.hidden=true; view.hidden=false;
    view.onload=function(){ wire(); };
    view.srcdoc=html; }

  /* catch clicks inside the frame so navigation stays inside the backend */
  function wire(){ try{ var d=view.contentDocument; if(!d) return;
      d.addEventListener('click',function(e){ var a=e.target&&e.target.closest&&e.target.closest('a'); if(!a) return;
        var href=a.getAttribute('href')||''; if(/^https?:/i.test(href)&&href.indexOf(location.origin)!==0&&href.indexOf(BASE)!==0) return; /* external link: leave it */
        var id=gameIdFromHref(href);
        if(id){ e.preventDefault(); openGame(id); return; }
        if(isBack(href)){ e.preventDefault(); openOverview(); return; }
      },true);
    }catch(e){} }

  function openOverview(){ api('/api/ava/overview').then(show).catch(fail); }
  function openGame(id){ boot.hidden=false; view.hidden=true; document.querySelector('#boot .t').textContent='Opening map';
    api('/api/ava/page/'+id).then(show).catch(fail); }
  function fail(e){ var m=e&&e.message; if(m==='unauthorized') return; boot.hidden=false; view.hidden=true;
    errEl.textContent = (m==='notuploaded')
      ? 'The maps are not in the database yet — run the update workflow once more.'
      : 'Could not reach the server. Give it a moment and refresh.'; }

  /* login box, identical in spirit to the planner's */
  var loginOpen=false;
  function askLogin(force){ if(loginOpen) return; if(!force&&pw()){ return; } loginOpen=true; boot.hidden=true;
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(6,9,13,.9);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif';
    ov.innerHTML='<form style="background:#111721;border:1px solid #263243;border-radius:14px;padding:22px 20px;width:280px;max-width:90vw">'+
      '<div style="color:#e9eef4;font-weight:700;font-size:16px;margin-bottom:4px">AVA Games Database</div>'+
      '<div style="color:#9aa8b9;font-size:13px;margin-bottom:12px">Clan password</div>'+
      '<input type="password" autocomplete="current-password" style="width:100%;height:40px;border:1px solid #334256;border-radius:9px;background:#0f151e;color:#e9eef4;padding:0 10px;font-size:15px;box-sizing:border-box">'+
      '<div class="err" style="color:#ef4444;font-size:12px;min-height:15px;margin:6px 0"></div>'+
      '<button type="submit" style="width:100%;height:40px;border:0;border-radius:9px;background:#c9a24a;color:#141414;font-weight:700;font-size:15px;cursor:pointer">Open</button></form>';
    document.body.appendChild(ov);
    var inp=ov.querySelector('input'), er=ov.querySelector('.err'); setTimeout(function(){ inp.focus(); },50);
    ov.querySelector('form').addEventListener('submit',function(e){ e.preventDefault(); er.textContent=''; var v=inp.value;
      fetch(BASE+'/api/check',{headers:{'Authorization':'Bearer '+v}}).then(function(r){
        if(r.ok){ setPw(v); ov.remove(); loginOpen=false; boot.hidden=false; openOverview(); }
        else er.textContent='Wrong password';
      }).catch(function(){ er.textContent='Cannot reach the server'; }); });
  }

  if(!pw()) askLogin(); else openOverview();
})();
</script>
</body>
</html>
